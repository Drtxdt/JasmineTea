[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jasminetea-mcp"
version = "0.1.0"
description = "A permission-scoped Gitea and EduCoder collaboration MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1", "pydantic>=2.10,<3", "platformdirs>=4,<5", "python-dotenv>=1,<2", "filelock>=3.16,<5"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9", "build>=1.2", "twine>=6"]

[project.scripts]
jasminetea-mcp = "jasminetea_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jasminetea_mcp"]

[tool.hatch.build]
exclude = [".venv/**", ".tmp/**", ".cache/**", "artifacts/**", "**/.env", "**/.env.*", "dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

